<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ cfg.color or '#2563eb' }}">
  <title>{% block titulo %}Votaciones{% endblock %} · {{ cfg.comunidad }}</title>
  <link rel="preload" href="{{ raiz }}/static/fonts/plus-jakarta-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ raiz }}/static/fonts/plus-jakarta-sans-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ raiz }}/static/style.css">
  <style>:root { --primario: {{ cfg.color or "#2563eb" }}; }</style>
</head>
<body>
  <header class="cabecera">
    <div class="contenedor">
      <a class="marca" href="{{ raiz }}/index.html">
        <span class="marca-icono" aria-hidden="true"></span>
        <span>
          <strong>{{ cfg.comunidad }}</strong>
          <small>Votaciones entre vecinos</small>
        </span>
      </a>
    </div>
  </header>
  <main class="contenedor">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="pie">
    <div class="contenedor">
      <p>{{ cfg.direccion }}{% if cfg.contacto_email %} · Dudas: <a href="mailto:{{ cfg.contacto_email }}">{{ cfg.contacto_email }}</a>{% endif %}</p>
      <p class="tenue">El voto se emite solo en <a href="https://www.belenios.org" rel="noopener">Belenios</a>. Este sitio informa; no recibe ni registra votos.</p>
    </div>
  </footer>
  <script src="{{ raiz }}/static/estado.js"></script>
</body>
</html>
