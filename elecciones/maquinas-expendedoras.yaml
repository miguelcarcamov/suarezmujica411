# Consulta en preparación. Mientras borrador sea true no se exigen fechas
# y el sitio no ofrece el botón de votar.
titulo: "Máquinas expendedoras Coca-Cola y Nescafé"
resumen: "Consulta para aprobar o rechazar la instalación de máquinas expendedoras de Coca-Cola y Nescafé, cuyo ingreso sería un recurso de la comunidad."
borrador: true

# Fechas en hora de Chile, formato AAAA-MM-DD HH:MM. Completar antes de abrir.
# sesion_informativa: "AAAA-MM-DD HH:MM"
# apertura: "AAAA-MM-DD HH:MM"
# cierre: "AAAA-MM-DD HH:MM"

modalidad: "Consulta por escrito"
# Mayoría reforzada: constituir y aprobar con al menos el 66 % de los derechos.
tipo_sesion: reforzada
# Un voto por departamento: el comité indicó que todas las unidades pesan igual.
ponderada: false

# Se completan al crear la elección en Belenios. Vacío = no hay botón de votar.
url_belenios: ""
url_resultados: ""

antecedentes: |
  La comunidad consultará si aprueba instalar, en espacios comunes, máquinas
  expendedoras de Coca-Cola y de Nescafé. El ingreso que generen sería un
  recurso de la comunidad.

  El voto es uno por departamento, porque todas las unidades tienen el mismo
  peso. La materia se vota con mayoría reforzada (art. 15, Ley 21.442): para
  constituir la consulta y para aprobar hace falta al menos el 66 % de las
  unidades. Quien no vota no suma a ese 66 %. Solo votan las unidades hábiles
  del padrón que verifique el comité.

  El voto no se emite en este sitio. Cada persona vota en Belenios: el voto se
  cifra en su propio dispositivo, la urna es pública y cualquiera puede
  recontar el resultado. El padrón, con RUT y correos, no se publica.

pendientes:
  - "Correo de contacto del comité"
  - "Número de departamentos con derecho a voto"
  - "Fecha de la sesión informativa, de la apertura y del cierre"
  - "Lugar exacto donde irían las máquinas"
  - "Plazo del convenio y cómo se puede terminar"
  - "Cómo se calcula el ingreso y a qué fondo entra"
  - "Quién opera, reponen y responde por mantención y energía"
  - "Propuesta o contrato, con enlace de descarga"

preguntas:
  - pregunta: "¿Aprueba que la comunidad instale máquinas expendedoras de Coca-Cola y Nescafé en espacios comunes, para que el ingreso que generen sea un recurso de la comunidad?"
    opciones:
      - "Apruebo"
      - "Rechazo"
