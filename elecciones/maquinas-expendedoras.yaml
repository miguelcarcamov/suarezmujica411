# Resumen para votar informado. Detalle en los PDF públicos enlazados abajo.
antecedentes: |
  ### Qué se consulta

  En el edificio ya operan **dos máquinas** de Rosetta SpA (marca **VUELTA**):

  - una de **café de grano Nescafé** (convenio VUELTA CAFÉ);
  - una **expendedora de bebidas** (convenio VUELTA).

  Antes hubo un “contrato de arrendamiento”; el **2 de septiembre de 2026** se reemplazó por convenios de **instalación y operación de un servicio** (no son arriendo ni comodato del espacio). Cada máquina usa unos **1 m²** en el lugar acordado con la administración; la comunidad sigue administrando ese espacio y se puede **reubicar** de común acuerdo.

  Esta votación pide **ratificar y mantener** esos convenios, para que el aporte económico siga siendo un recurso de la comunidad.

  ### Quién hace qué

  - **VUELTA / Rosetta SpA:** instala, mantiene, repara, abastece y, al término, retira la máquina **a su costo**.
  - **Comunidad:** permite la permanencia, facilita el acceso para mantención y abastecimiento.
  - **Electricidad:** en el convenio de **café**, el consumo eléctrico es de cargo de la comunidad (ya considerado en el trato). En el de **bebidas**, la electricidad es de cargo de VUELTA. La máquina de café **no** se conecta a la red de agua del edificio.

  ### Aporte a la comunidad

  Cada mes VUELTA paga un **aporte** a la cuenta que indique la comunidad. Se calcula como un **porcentaje del margen bruto mensual** de esa máquina (ingresos netos menos el costo directo de lo vendido), según tramos en UF, de forma progresiva:

  | Margen bruto mensual | Aporte |
  | --- | --- |
  | 0 – 15 UF | 2 % |
  | 15 – 25 UF | 5 % |
  | 25 – 35 UF | 10 % |
  | 35 UF o más | 18 % |

  VUELTA debe enviar un **reporte de ventas** dentro de los cinco primeros días hábiles del mes siguiente, y pagar el aporte en ese mismo plazo. Si no paga durante **dos meses seguidos**, la comunidad puede pedir el término anticipado.

  Los montos concretos recibidos deben figurar en las **rendiciones de cuentas** a los copropietarios (Ley de Copropiedad).

  ### Plazo y cómo terminar

  Vigencia desde el **2 de septiembre de 2026**, por **12 meses**, con renovación automática por períodos iguales. En un período de renovación, cualquiera de las partes puede terminar avisando por escrito:

  - café: al menos **30 días** de anticipación;
  - bebidas: al menos **60 días** de anticipación.

  Al término, VUELTA retira la máquina y deja el espacio en buen estado (desgaste normal).

  ### Documentos

  Abajo están los convenios en **versión pública** (mismo contenido operativo y económico; se omitieron RUT, cédulas y teléfonos de personas naturales). Los originales firmados los guarda el comité.

