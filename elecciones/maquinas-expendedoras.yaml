titulo: "Máquinas expendedoras (Amawa, Nescafé y Coca-Cola)"
resumen: "Si se instalan máquinas expendedoras (Amawa, Nescafé y Coca-Cola) en espacios comunes, y ese ingreso queda para la comunidad."
borrador: false

# Fechas en hora de Chile, formato AAAA-MM-DD HH:MM.
# La lista de Belenios no se puede cambiar después de abrir: poderes antes de la apertura.
apertura: "2026-11-24 12:00"
cierre: "2026-11-28 12:00"
# Plazo para recibir poderes de arrendatarios (antes de cerrar la lista y abrir Belenios).
plazo_poder: "2026-11-23 20:00"

modalidad: "Consulta por escrito"
# Mayoría reforzada: constituir y aprobar con al menos el 66 % de los derechos.
tipo_sesion: reforzada
# Un voto por departamento: el comité indicó que todas las unidades pesan igual.
ponderada: false

# Se completan al crear la elección en Belenios. Vacío = no hay botón de votar.
url_belenios: ""
url_resultados: ""

# Antecedentes de la propuesta (lugar, plazo, convenio). Vacío hasta que existan:
# el quórum y la ley ya se explican una sola vez en la ficha.

pendientes:
  - "Número de departamentos con derecho a voto"
  - "Enlace de Belenios (url_belenios) antes de la apertura"
  - "Lugar exacto donde irían las máquinas"
  - "Plazo del convenio y cómo se puede terminar"
  - "Cómo se calcula el ingreso y a qué fondo entra"
  - "Quién las opera, las reponen y paga la energía"
  - "Propuesta o contrato, con enlace de descarga"

preguntas:
  - pregunta: "¿Aprueba que la comunidad instale máquinas expendedoras (Amawa, Nescafé y Coca-Cola) en espacios comunes, para que el ingreso que generen sea un recurso de la comunidad?"
    opciones:
      - "Apruebo"
      - "Rechazo"
